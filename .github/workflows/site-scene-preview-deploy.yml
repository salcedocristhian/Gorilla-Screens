name: Deploy approved site-scene preview
on:
  push:
    branches: [feature/deploy-site-scene-20261108]
    paths: [.github/workflows/site-scene-preview-deploy.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gorilla-site-scene-preview
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/feature/deploy-site-scene-20261108'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_SHA: 861bf3cd8098d61b525d8b36d6d0ddf822163b68
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 861bf3cd8098d61b525d8b36d6d0ddf822163b68
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check saved credentials and existing preview targets
        id: targets
        env:
          APPROVED: ${{ vars.GORILLA_BRIDGE_DEPLOY_APPROVED }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          if os.environ.get('APPROVED') != 'YES':
              raise SystemExit('Existing pilot deployment approval variable is not YES.')
          token=os.environ.get('CLOUDFLARE_API_TOKEN')
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID')
          if not token or not account:
              raise SystemExit('Missing saved Cloudflare credentials; no deployment performed.')
          for name in ('gorilla-studio-ai-bridge','previewfixed'):
              url=f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/{name}/settings'
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token})
              try:
                  with urllib.request.urlopen(req) as r: result=json.load(r)
              except urllib.error.HTTPError as e:
                  print('Worker '+name+' verification returned HTTP '+str(e.code))
                  if name=='previewfixed':
                      with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('frontend=false\n')
                      continue
                  raise SystemExit('Cannot verify AI bridge; deployment stopped.')
              except Exception:
                  raise SystemExit('Cannot connect to Cloudflare; deployment stopped.')
              if not result.get('success'): raise SystemExit('Worker verification failed: '+name)
              print('Verified existing target: '+name)
              if name=='previewfixed':
                  with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('frontend=true\n')
          PY
      - name: Validate the exact merged implementation
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          node tests/test_site_scene.mjs
          node tests/test_vision_bridge.mjs
          node tests/test_vision_api.mjs
      - name: Prepare only public frontend assets
        run: |
          mkdir -p .deploy/public
          cp index.html sw.js manifest.webmanifest .deploy/public/
          cp -R assets css js docs .deploy/public/
          for optional in robots.txt _headers; do if test -f "$optional"; then cp "$optional" .deploy/public/; fi; done
          python3 - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('.deploy')
          (root/'public'/'_release.json').write_text(json.dumps({'commit':os.environ['SOURCE_SHA'],'feature':'site-scene-v1'}))
          (root/'wrangler.json').write_text(json.dumps({'name':'previewfixed','compatibility_date':'2026-11-07','workers_dev':True,'keep_vars':True,'assets':{'directory':'./public'}}))
          PY
      - name: Install deploy CLI
        run: npm install --no-save --no-package-lock wrangler@4
      - name: Deploy matching AI bridge preserving secrets
        run: npx wrangler deploy --config cloudflare/wrangler.bridge.json
      - name: Verify bridge configuration and preview origin
        run: |
          python3 - <<'PY'
          import json,urllib.request
          base='https://gorilla-studio-ai-bridge.salcedo-cristhian-2020.workers.dev'
          with urllib.request.urlopen(base+'/health') as r: data=json.load(r)
          if data.get('ready') is not True: raise SystemExit('Bridge health is not ready.')
          origin='https://previewfixed.salcedo-cristhian-2020.workers.dev'
          req=urllib.request.Request(base+'/api/analyze',method='OPTIONS',headers={'Origin':origin,'Access-Control-Request-Method':'POST'})
          with urllib.request.urlopen(req) as r:
              if r.status!=204 or r.headers.get('Access-Control-Allow-Origin')!=origin:
                  raise SystemExit('Preview origin is not authorized. Existing access settings retained.')
          print('Bridge ready; exact preview origin authorized.')
          PY
      - name: Deploy existing preview frontend
        if: steps.targets.outputs.frontend == 'true'
        run: npx wrangler deploy --config .deploy/wrangler.json
      - name: Verify published release and scene modules
        if: steps.targets.outputs.frontend == 'true'
        run: |
          python3 - <<'PY'
          import json,os,time,urllib.request
          base='https://previewfixed.salcedo-cristhian-2020.workers.dev'
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(base+'/_release.json?verify='+os.environ['SOURCE_SHA']) as r: data=json.load(r)
                  if data.get('commit')==os.environ['SOURCE_SHA']: break
              except Exception: pass
              time.sleep(5)
          else: raise SystemExit('Published release could not be verified. Check preview access/deployment.')
          for path,marker in [('index.html','js/site-scene-view.js'),('js/site-scene-view.js','GSSSiteSceneView'),('js/site-scene-contract.js','site-scene-v1')]:
              with urllib.request.urlopen(base+'/'+path+'?verify='+os.environ['SOURCE_SHA']) as r: content=r.read().decode()
              if marker not in content: raise SystemExit('Expected module missing: '+path)
          print('PASS: published preview matches merged source and reconstruction modules.')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Preview deployed: '+base+'\n\nSource: '+os.environ['SOURCE_SHA']+'\n\nBridge ready and preview origin allowed. Live Gemini photo fidelity remains untested.\n')
          PY
      - name: Report frontend access blocker
        if: steps.targets.outputs.frontend != 'true'
        run: |
          echo 'AI bridge updated; frontend preview was not deployed because its existing Worker could not be accessed.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
