name: Gorilla FreeLLMAPI Private Pilot CI

on:
  push:
    branches:
      - experiment/freellmapi-vision-pilot
  pull_request:
    branches:
      - main
    paths:
      - experiments/freellmapi/**
      - tests/test_freellmapi.mjs
      - .github/workflows/freellmapi-pilot-ci.yml

jobs:
  local-vision-mock:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify pilot code syntax
        run: |
          node --check experiments/freellmapi/server.mjs
          node --check experiments/freellmapi/pilot.js
          node --check tests/test_freellmapi.mjs
      - name: Mock FreeLLMAPI vision and test privacy safeguards
        run: node tests/test_freellmapi.mjs
      - name: Original Gorilla V17 regression
        run: node tests/test_v17.mjs

  vision-browser-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test local-only vision pilot with mock provider in Chromium
        run: node tests/test_freellmapi_browser.mjs
      - name: Upload optional mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freellmapi-mobile-qa
          path: qa-freellmapi-mobile.png
          if-no-files-found: ignore
